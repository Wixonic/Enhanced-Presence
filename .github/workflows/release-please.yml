name: Release Please

on:
  push:
    branches:
      - Default
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name to build and publish (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json

  build-tauri:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
            args: "--target aarch64-apple-darwin"
            bundle_path: "src-tauri/target/aarch64-apple-darwin/release/bundle"
            rust_target: "aarch64-apple-darwin"
            platform_short: "macOS"
            arch_short: "arm64"

          - platform: "macos-latest"
            args: "--target x86_64-apple-darwin"
            bundle_path: "src-tauri/target/x86_64-apple-darwin/release/bundle"
            rust_target: "x86_64-apple-darwin"
            platform_short: "macOS"
            arch_short: "x64"

          - platform: "macos-latest"
            args: "--target universal-apple-darwin"
            bundle_path: "src-tauri/target/universal-apple-darwin/release/bundle"
            rust_target: "aarch64-apple-darwin,x86_64-apple-darwin"
            platform_short: "macOS"
            arch_short: "universal"
            cache_key: "universal-apple-darwin"

          - platform: "ubuntu-22.04"
            args: ""
            bundle_path: "src-tauri/target/release/bundle"
            rust_target: ""
            platform_short: "linux"
            arch_short: "amd64"

          - platform: "ubuntu-22.04"
            args: "--target aarch64-unknown-linux-gnu --bundles deb,rpm"
            bundle_path: "src-tauri/target/aarch64-unknown-linux-gnu/release/bundle"
            rust_target: "aarch64-unknown-linux-gnu"
            platform_short: "linux"
            arch_short: "aarch64"

          - platform: "windows-latest"
            args: ""
            bundle_path: "src-tauri/target/release/bundle"
            rust_target: ""
            platform_short: "windows"
            arch_short: "x64"

          - platform: "windows-latest"
            args: "--target aarch64-pc-windows-msvc"
            bundle_path: "src-tauri/target/aarch64-pc-windows-msvc/release/bundle"
            rust_target: "aarch64-pc-windows-msvc"
            platform_short: "windows"
            arch_short: "aarch64"

    runs-on: ${{ matrix.platform }}
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || needs.release-please.outputs.tag_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: "npm"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
          key: ${{ matrix.cache_key || matrix.rust_target }}

      - name: Install Linux system dependencies (x86_64)
        if: matrix.platform == 'ubuntu-22.04' && matrix.rust_target == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            curl \
            wget \
            file \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install Linux system dependencies (aarch64 cross)
        if: matrix.rust_target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo dpkg --add-architecture arm64
          sudo sed -i 's/^deb /deb [arch=amd64,i386] /' /etc/apt/sources.list
          printf '\ndeb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse\ndeb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse\n' \
            | sudo tee -a /etc/apt/sources.list
          sudo apt-get update
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            libgtk-3-dev:arm64 \
            libwebkit2gtk-4.1-dev:arm64 \
            libjavascriptcoregtk-4.1-dev:arm64 \
            libsoup-3.0-dev:arm64 \
            libssl-dev:arm64 \
            libayatana-appindicator3-dev:arm64 \
            librsvg2-dev:arm64

      - name: Install Node dependencies
        run: npm ci

      - name: Generate icons
        run: npm run tauri icon src-tauri/icons/icon.png

      - name: Build frontend & app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ matrix.platform == 'macos-latest' && '-' || '' }}
          PKG_CONFIG_ALLOW_CROSS: ${{ matrix.rust_target == 'aarch64-unknown-linux-gnu' && '1' || '' }}
          PKG_CONFIG_PATH: ${{ matrix.rust_target == 'aarch64-unknown-linux-gnu' && '/usr/lib/aarch64-linux-gnu/pkgconfig' || '' }}
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.rust_target == 'aarch64-unknown-linux-gnu' && 'aarch64-linux-gnu-gcc' || '' }}
        with:
          args: ${{ matrix.args }}

      - name: Upload artifacts (macOS)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${TAG#v}"
          PREFIX="Enhanced-Presence.$VERSION.${{ matrix.platform_short }}.${{ matrix.arch_short }}"
          BUNDLE="${{ matrix.bundle_path }}"
          for f in "$BUNDLE/dmg/"*.dmg; do
            [ -f "$f" ] || continue
            cp "$f" "$(dirname "$f")/$PREFIX.dmg"
            gh release upload "$TAG" "$(dirname "$f")/$PREFIX.dmg" --clobber
          done
          for f in "$BUNDLE/macos/"*.app.tar.gz; do
            [ -f "$f" ] || continue
            cp "$f" "$(dirname "$f")/$PREFIX.app.tar.gz"
            gh release upload "$TAG" "$(dirname "$f")/$PREFIX.app.tar.gz" --clobber
          done

      - name: Upload artifacts (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${TAG#v}"
          PREFIX="Enhanced-Presence.$VERSION.${{ matrix.platform_short }}.${{ matrix.arch_short }}"
          BUNDLE="${{ matrix.bundle_path }}"
          for f in "$BUNDLE/deb/"*.deb; do
            [ -f "$f" ] || continue
            cp "$f" "$(dirname "$f")/$PREFIX.deb"
            gh release upload "$TAG" "$(dirname "$f")/$PREFIX.deb" --clobber
          done
          for f in "$BUNDLE/rpm/"*.rpm; do
            [ -f "$f" ] || continue
            cp "$f" "$(dirname "$f")/$PREFIX.rpm"
            gh release upload "$TAG" "$(dirname "$f")/$PREFIX.rpm" --clobber
          done
          for f in "$BUNDLE/appimage/"*.AppImage; do
            [ -f "$f" ] || continue
            cp "$f" "$(dirname "$f")/$PREFIX.AppImage"
            gh release upload "$TAG" "$(dirname "$f")/$PREFIX.AppImage" --clobber
          done

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $VERSION = $env:TAG.TrimStart("v")
          $PREFIX = "Enhanced-Presence.$VERSION.${{ matrix.platform_short }}.${{ matrix.arch_short }}"
          $BUNDLE = "${{ matrix.bundle_path }}"
          Get-ChildItem "$BUNDLE/msi/*.msi" -ErrorAction SilentlyContinue | ForEach-Object {
            $dest = Join-Path $_.DirectoryName "$PREFIX.msi"
            Copy-Item $_.FullName $dest
            gh release upload $env:TAG $dest --clobber
          }
          Get-ChildItem "$BUNDLE/nsis/*-setup.exe" -ErrorAction SilentlyContinue | ForEach-Object {
            $dest = Join-Path $_.DirectoryName "$PREFIX.setup.exe"
            Copy-Item $_.FullName $dest
            gh release upload $env:TAG $dest --clobber
          }

  publish-release:
    needs: [release-please, build-tauri]
    if: ${{ needs.release-please.outputs.release_created || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Publish release
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || needs.release-please.outputs.tag_name }}"
          PRERELEASE_FLAG=""
          if [[ "$TAG" == v0.* || "$TAG" == *"-"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          gh release edit "$TAG" --draft=false --title "Enhanced Presence $TAG" $PRERELEASE_FLAG
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
